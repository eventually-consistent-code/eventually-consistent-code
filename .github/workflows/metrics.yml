# Renders assets/metrics.svg (stats + streak + languages) into THIS repo
# once a day, so the profile README never depends on a third-party image
# server. Needs one secret: METRICS_TOKEN, a classic PAT with public_repo
# and read:user (add repo if private contributions should count).
# Pinned to lowlighter/metrics v3.34 by commit sha.
name: metrics

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eventually-consistent-code
          filename: assets/metrics.svg
          committer_branch: main
          committer_message: "assets: refresh metrics.svg"
          template: classic
          base: header, activity, community, repositories
          base_indepth: no
          config_timezone: America/Chicago
          config_display: large
          config_animations: no
          config_padding: 0, 0
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, shell
          plugin_languages_colors: "0:#f5a97f, 1:#f4dbd6, 2:#c6a0f6, 3:#8aadf4, 4:#a6da95, 5:#91d7e3"
          # Palette override, verified against the 2026-10-16 render. Three
          # traps: headings carry class="field", so h2.field must outrank the
          # generic .field rule; the isocalendar is a 960px-wide inner <svg>
          # laid over the streak column, so only svg:root may get a background;
          # the calendar hardcodes GitHub's green ramp as fill attributes, which
          # attribute selectors override.
          extras_css: |
            svg:root, body { background: #24273a !important; }
            .field, .row, .text, .legend, span, p { color: #cad3f5 !important; }
            h1.field, h2.field, h3.field { color: #f5a97f !important; border-color: #b97a5c !important; }
            text { fill: #cad3f5 !important; }
            [fill="#ebedf0"] { fill: #363a4f !important; }
            [fill="#9be9a8"] { fill: #6b5040 !important; }
            [fill="#40c463"] { fill: #9c6b4e !important; }
            [fill="#30a14e"] { fill: #d48f68 !important; }
            [fill="#216e39"] { fill: #f5a97f !important; }
